name: Argos

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Expected deployed commit; empty selects the current branch head
        type: string
        default: ""
      pr-number:
        description: Exact PR; empty discovers the open PR for this head
        type: string
        default: ""
      base-sha:
        description: Previous successful production browser run
        type: string
        default: ""

concurrency:
  group: argos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: fulldotdev/agents/.github/workflows/visual.yml@e7ef8ad336cecf96d9f5c3af0ee07502abb03351
    with:
      expected-sha: ${{ inputs.expected-sha }}
      pr-number: ${{ inputs.pr-number }}
      base-sha: ${{ inputs.base-sha }}
      content-profile: none
      node-version: "24"
      netlify-site: fulldev-ui
