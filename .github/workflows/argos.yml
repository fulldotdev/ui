name: Argos

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: argos-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: fulldotdev/agents/.github/workflows/visual.yml@4dd768cedaaffd78fdd831623d30c89bd5fb593e
    with:
      content-profile: none
      node-version: "24"
