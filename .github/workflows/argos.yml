name: Argos

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: argos-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: fulldotdev/agents/.github/workflows/visual.yml@ba7089dc49048185471d265df54e026033c7bf84
    with:
      content-profile: none
      node-version: "24"
      netlify-site: fulldev-ui
