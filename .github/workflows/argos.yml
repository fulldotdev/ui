name: Argos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Expected deployed commit; empty selects the current branch head
        type: string
        default: ""
      pr-number:
        description: Exact PR; empty discovers the open PR for this head
        type: string
        default: ""

      base-sha:
        description: Dispatcher compatibility; comparison base is resolved automatically
        type: string
        default: ""

concurrency:
  group: argos-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      statuses: write
    uses: fulldotdev/agents/.github/workflows/visual.yml@b6199d34e14b7403cbf8938dac4b87a58433204d
    with:
      expected-sha: ${{ inputs.expected-sha }}
      pr-number: ${{ inputs.pr-number }}
      content-profile: none
      node-version: "24"
      netlify-site: fulldev-ui
