name: Browser interactions

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Expected deployed commit; empty selects the current branch head
        type: string
        default: ""
      pr-number:
        description: Exact PR; empty discovers the open PR for this head
        type: string
        default: ""
      base-sha:
        description: Previous successful production browser run
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: true

jobs:
  interactions:
    name: Browser interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tested-sha: ${{ steps.deploy.outputs.sha }}
    env:
      pnpm_config_ignore_scripts: "true"
      pnpm_config_ignore_pnpmfile: "true"
    steps:
      - name: Resolve exact Netlify deployment
        id: deploy
        uses: fulldotdev/agents/.github/actions/netlify-deploy@32535d2fc34ff946de6c33217b266f976ee702f4
        with:
          site: fulldev-ui
          expected-sha: ${{ inputs.expected-sha }}
          pr-number: ${{ inputs.pr-number }}
          base-sha: ${{ inputs.base-sha }}
          allow-draft: "true"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm test:interactions
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: interaction-test-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  report:
    name: Report interaction result
    needs: interactions
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      # No checkout or PR code executes with this status-writing token.
      - name: Report the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.interactions.result }}
          TESTED_SHA: ${{ needs.interactions.outputs.tested-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const passed = process.env.TEST_RESULT === "success" && process.env.TESTED_SHA === process.env.GITHUB_SHA;
          writeFileSync("status.json", JSON.stringify({
            context: "UI interaction checks",
            state: passed ? "success" : "failure",
            description: passed ? "Browser interactions passed on the exact Netlify commit" : "Browser interactions did not pass for this commit",
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }));
          NODE
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input status.json
