name: Ready

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Check]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  ready:
    uses: fulldotdev/.github/.github/workflows/ready.yml@c343f825f2ae7e4cecc484a9a41dee47af2105b9
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      netlify-checks: '["netlify/fulldev-ui/deploy-preview"]'
      merge-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      merge-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
