name: Ready

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Check]
    types: [requested, in_progress, completed]
  # Netlify's previews often finish after Check.
  status:

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  ready:
    if: github.event_name != 'status' || (startsWith(github.event.context, 'netlify/') && github.event.state != 'pending')
    uses: fulldotdev/.github/.github/workflows/ready.yml@b614208c0b4d73f6f15836777777b2c1ac5a94b3
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      netlify-checks: '["netlify/fulldev-ui/deploy-preview"]'
      merge-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      merge-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
