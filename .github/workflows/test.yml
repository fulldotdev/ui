name: Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: fulldotdev/.github/.github/workflows/test.yml@b5761e7b9037b147651d781816334bf3abe19873
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      unit: false
      http: false
      browser: false
