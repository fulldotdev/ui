name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: fulldotdev/.github/.github/workflows/check.yml@f2895c09a7d688a58f2bacc200c7b18bc07574e7
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      command: vp run check:source
