name: Check

# One workflow per PR push: the source checks, then Review, the required check
# that passes once they and the Netlify preview succeeded. It has no
# workflow_dispatch: a skipped Review on a PR head would count as passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: fulldotdev/.github/.github/workflows/check.yml@3f6e99b0ee477017b0902c2697cfef934d440747
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      command: vp run check
      test-command: vp run test:unit

  review:
    name: Review
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [check]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    permissions:
      statuses: read
    steps:
      - uses: fulldotdev/.github/.github/actions/review@3f6e99b0ee477017b0902c2697cfef934d440747
        with:
          needs: ${{ toJSON(needs) }}
          netlify-checks: '["netlify/fulldev-ui/deploy-preview"]'
          # Site previews can take longer than the default 15 minutes.
          timeout-minutes: 30
