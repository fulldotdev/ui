name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# Installs, also nested ones in scripts, skip pnpmfiles. pnpm-workspace.yaml skips
# all lifecycle scripts, including this package's own; it defines none.
env:
  pnpm_config_ignore_pnpmfile: "true"

jobs:
  release-pr:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so the release pull request
      # triggers the organization Check like any other pull request.
      - name: Create release token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          # Keep the token out of .git/config during the install; Changesets
          # pushes through the GitHub API instead (commitMode below).
          persist-credentials: false

      - name: Setup PNPM
        # v6.1.0 is the first release that installs pnpm 12; the v6 tag still points to 6.0.10.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Create release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm release
          publish: pnpm release:publish
          commit: "[ci] release"
          title: "[ci] release"
          # Commits and tags go through the GitHub API with the App token, signed
          # and attributed to the App, so no Git credential is needed in the checkout.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
