name: Feature request
description: Suggest a new component, block, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new item, a prop, or a change. Reference shadcn/ui parity where relevant.
