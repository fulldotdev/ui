name: Bug report
description: Something in a component, block, or install is broken.
labels: [bug]
body:
  - type: input
    id: item
    attributes:
      label: Component or block
      placeholder: "@fulldev/hero-1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Install command, page source, or a link to a minimal repo.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "astro 6.3, fulldev-ui 0.9.3, node 24"
