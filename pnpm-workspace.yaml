allowBuilds:
  core-js: false
  esbuild: true
  sharp: true

overrides:
  # favilib 1.0.5 (via astro-favicons, docs site only) pins sharp ^0.33.5,
  # which is vulnerable below 0.35.4. It only uses resize and metadata, which
  # work the same in 0.35.
  "favilib>sharp": ^0.35.4

# Supply-chain protection on top of the pnpm 11 defaults (24h release age, no exotic subdependencies).
# Enforce the release age, and reject releases from the last 7 days that lost publish trust.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
minimumReleaseAgeStrict: true
