# Shopify Theme Check for the library, run by `pnpm check:source`.
extends: theme-check:recommended

# A library has no templates that render its snippets.
OrphanedSnippet:
  enabled: false

# Nor locales: the theme owns its translations.
TranslationKeyExists:
  enabled: false

# Docs examples take their inputs from the theme that renders them.
UndefinedObject:
  ignore:
    - examples/**
